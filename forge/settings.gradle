pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'litematica-turbo-forge'

// Forge / NeoForge jars (Architectury Loom, which cannot share a build with Fabric Loom).
// Each one lives in versions/<mc>-<loader> and reuses the code of a Fabric version folder.
// Build just some of them with -Pmc=1.20.1-forge,1.21.4-neoforge
def all = ['1.16.5-forge', '1.17.1-forge', '1.18.2-forge', '1.19.4-forge', '1.20.1-forge',
           '1.20.4-neoforge', '1.21.1-neoforge', '1.21.4-neoforge', '1.21.10-neoforge', '1.21.11-neoforge', '26.2-neoforge']
def only = providers.gradleProperty('mc').orNull

for (String id : all) {
    def dir = file("../versions/$id")
    if ((only == null || only.split(',').contains(id)) && new File(dir, 'build.gradle').exists()) {
        include id
        project(":$id").projectDir = dir
    }
}
